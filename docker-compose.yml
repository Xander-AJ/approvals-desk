services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: approvals }
    ports: ["5432:5432"]
    volumes: ["./infra/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4317:4317"]
  sandbox:
    build: { context: ., dockerfile: sandbox/Dockerfile }
    environment:
      SANDBOX_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sandbox
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8001:8001"]
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/approvals
    depends_on: { postgres: { condition: service_healthy } }
  api: &backend
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: &env
      AD_DATABASE_URL: postgresql+asyncpg://app_user:app_user@postgres:5432/approvals
      AD_CHECKPOINT_DSN: postgresql://postgres:postgres@postgres:5432/approvals
      AD_SANDBOX_URL: http://sandbox:8001
      AD_REDIS_URL: redis://redis:6379
      AD_JAEGER_URL: http://localhost:16686
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/approvals
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      AD_DEV_AUTH: "true"
      AD_JWT_SECRET: compose-dev-only-secret-0123456789-abcdef
      AD_ASYNC_RESUME: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      sandbox: { condition: service_started }
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    ports: []
    restart: unless-stopped   # `docker kill` it live in the demo; it resumes runs from the checkpointer on start
