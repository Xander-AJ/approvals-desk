name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run mypy --strict app
      - run: uv run pytest -q          # unit + testcontainers integration + RLS + chaos

  sandbox:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sandbox } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -q

  evals:
    runs-on: ubuntu-latest
    needs: backend
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      # Replays recorded Claude Haiku 4.5 outputs (no API key, no cost, deterministic).
      # Re-record after any prompt change: see evals/README.md
      - run: >
          uv run python -m evals.run --set all --provider anthropic --model anthropic/claude-haiku-4.5
          --mode replay --fixtures ../evals/fixtures --min-accuracy 0.8 --max-violations 0 --max-unnecessary 0.1

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx eslint .
      - run: npm run typecheck   # typegen first: LayoutProps is generated by Next, absent on a clean checkout
      - run: npm test            # auth allowlist + API token minting
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180 api worker sandbox
      - run: docker compose exec -T api python -m app.seed
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose logs --tail=200

  docker:
    runs-on: ubuntu-latest
    needs: [backend, sandbox]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t approvals-api .
      - run: docker build -f sandbox/Dockerfile -t pesa-sandbox .
      - name: Trivy scan (HIGH/CRITICAL, fixable only)
        run: |
          for img in approvals-api pesa-sandbox; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
              image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img"
          done

  # Preview deploy of the web app per PR. Skips itself when the Vercel secrets are absent (forks, fresh clones).
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [web]
    permissions: { pull-requests: write, contents: read }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Vercel secrets not set; skipping preview."; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.gate.outputs.run == 'true'
        working-directory: web   # the Vercel project is linked from web/, not the repo root
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          echo "URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `Web preview: ${process.env.URL}`,
            });

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate
      - run: cd bootstrap && terraform init -backend=false -input=false && terraform validate
